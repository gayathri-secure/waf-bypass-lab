# =====================================================================
# Custom ModSecurity rules - WAF & Signature Bypass Lab, Phase 7
# Closes two gaps found in phases 5 and 6.
# Loaded as a CRS plugin:  /opt/owasp-crs/plugins/custom-after.conf
# Rule IDs 1000001-1000002 (local range, does not collide with CRS).
# =====================================================================

# ---------------------------------------------------------------------
# 1000001 - positive security model for the DVWA command-injection page
# The ip parameter is only ever an address, so anything outside
# [A-Za-z0-9 . : -] is a command chain. This is an allow-list, which is
# why it catches ;id |id &&id <newline>id and any future separator.
# ---------------------------------------------------------------------
SecRule REQUEST_URI "@contains /vulnerabilities/exec/" "id:1000001,phase:2,deny,status:403,log,msg:'Custom 1000001: ip parameter contains characters outside the allowed address set (command injection attempt)',tag:'custom/RCE',tag:'attack-rce',chain"
    SecRule ARGS:ip "!@rx ^[0-9a-zA-Z.:-]+$" "t:none,t:urlDecodeUni"

# ---------------------------------------------------------------------
# 1000002 - anti-smuggling policy
# Phase 6 showed Apache strips Content-Length before ModSecurity runs,
# so CRS 920181 cannot see a CL/TE conflict. Detection being impossible,
# we enforce policy instead: this application never needs chunked bodies,
# so any Transfer-Encoding header is rejected outright.
# ---------------------------------------------------------------------
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx ." "id:1000002,phase:1,deny,status:403,log,msg:'Custom 1000002: Transfer-Encoding header rejected (request smuggling hardening)',tag:'custom/smuggling',tag:'attack-protocol'"

